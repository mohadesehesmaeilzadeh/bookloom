<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بوک‌لوم</title>
  </head>
  <body>
    <script>
      ;(() => {
        try {
          const defaults = {
            language: 'fa',
            theme: 'system',
            accentColor: 'indigo',
            usePersianDigits: true,
          }
          const rawPreferences = window.localStorage.getItem('bookloom_preferences')
          const preferences = rawPreferences ? JSON.parse(rawPreferences) : defaults
          const theme = ['light', 'dark', 'system'].includes(preferences.theme)
            ? preferences.theme
            : defaults.theme
          const accent = ['indigo', 'emerald', 'rose', 'amber', 'slate'].includes(
            preferences.accentColor,
          )
            ? preferences.accentColor
            : defaults.accentColor
          const language = ['fa', 'en'].includes(preferences.language)
            ? preferences.language
            : defaults.language
          const resolvedTheme =
            theme === 'system'
              ? window.matchMedia?.('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme

          document.documentElement.dataset.theme = resolvedTheme
          document.documentElement.dataset.accent = accent
          document.documentElement.dataset.language = language
          document.documentElement.dataset.persianDigits =
            preferences.usePersianDigits === false ? 'false' : 'true'
          document.documentElement.lang = language
          document.documentElement.dir = language === 'en' ? 'ltr' : 'rtl'
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.accent = 'indigo'
          document.documentElement.dataset.language = 'fa'
          document.documentElement.dataset.persianDigits = 'true'
          document.documentElement.lang = 'fa'
          document.documentElement.dir = 'rtl'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
